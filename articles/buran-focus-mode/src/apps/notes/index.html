<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes — Buran demo</title>
<meta name="buran-focus">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="../app.css">
<style>:root { --bg: #fdfaf4; --fg: #22201c; --accent: #c9760a; }</style>
</head>
<body>
<div class="wrap">
  <header><span class="dot"></span><h1>Notes</h1></header>
  <p class="meta">scope /apps/notes/ · theme #e08a1e</p>

  <p>Type something, close the app, launch it again from the widget. The text
  should still be here — the browser keeps storage per site, and focus mode is
  the same site.</p>

  <div class="card">
    <h2>Scratchpad</h2>
    <textarea id="pad" placeholder="Anything…"></textarea>
    <p class="meta" id="status" style="margin:8px 0 0"> </p>
    <button class="ghost" id="clear">Clear</button>
  </div>

  <div class="nav"><a href="../">All demo apps</a></div>
</div>

<script type="module">
  const pad = document.getElementById('pad');
  const status = document.getElementById('status');
  const KEY = 'buran-notes-demo';

  // Storage can throw outright in a private window; a demo should not die of it.
  const safe = (fn, fallback) => { try { return fn(); } catch { return fallback; } };

  pad.value = safe(() => localStorage.getItem(KEY) ?? '', '');
  const saved = safe(() => localStorage.getItem(KEY + ':at'), null);
  status.textContent = saved ? `saved ${saved}` : 'nothing saved yet';

  let timer;
  pad.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const at = new Date().toLocaleTimeString();
      const ok = safe(() => {
        localStorage.setItem(KEY, pad.value);
        localStorage.setItem(KEY + ':at', at);
        return true;
      }, false);
      status.textContent = ok ? `saved ${at}` : 'storage unavailable';
    }, 400);
  });

  document.getElementById('clear').addEventListener('click', () => {
    pad.value = '';
    safe(() => { localStorage.removeItem(KEY); localStorage.removeItem(KEY + ':at'); }, null);
    status.textContent = 'cleared';
  });
</script>
</body>
</html>
