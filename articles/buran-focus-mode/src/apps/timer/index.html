<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer — Buran demo</title>
<meta name="buran-focus">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="../app.css">
<style>
  :root { --bg: #07130c; --fg: #e6f5ec; --accent: #22c55e; }
  .clock {
    font: 600 clamp(64px, 26vw, 132px)/1 ui-rounded, -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    text-align: center;
    margin: 28px 0 20px;
    letter-spacing: -.02em;
  }
  .clock.done { color: var(--accent); }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="dot"></span><h1>Focus Timer</h1></header>
  <p class="meta">scope /apps/timer/ · theme #16a34a</p>

  <div class="clock" id="clock">25:00</div>
  <div class="row">
    <button id="toggle">Start</button>
    <button class="ghost" id="reset">Reset</button>
  </div>

  <div class="card" style="margin-top:24px">
    <h2>Why this one</h2>
    <p style="margin:0">A countdown is the case where chrome hurts most: you
    glance at it, and a browser puts a URL and six controls in the way of a
    number. Nothing here is special to Buran — it is the manifest doing the
    work.</p>
  </div>

  <div class="nav"><a href="../">All demo apps</a></div>
</div>

<script type="module">
  const TOTAL = 25 * 60;
  let left = TOTAL;
  let handle = null;

  const clock = document.getElementById('clock');
  const toggle = document.getElementById('toggle');

  const render = () => {
    const m = String(Math.floor(left / 60)).padStart(2, '0');
    const s = String(left % 60).padStart(2, '0');
    clock.textContent = `${m}:${s}`;
    clock.classList.toggle('done', left === 0);
    document.title = left === TOTAL ? 'Timer — Buran demo' : `${m}:${s} — Timer`;
  };

  const stop = () => { clearInterval(handle); handle = null; toggle.textContent = 'Start'; };

  toggle.addEventListener('click', () => {
    if (handle) { stop(); return; }
    if (left === 0) left = TOTAL;
    toggle.textContent = 'Pause';
    handle = setInterval(() => {
      left = Math.max(0, left - 1);
      render();
      if (left === 0) stop();
    }, 1000);
  });

  document.getElementById('reset').addEventListener('click', () => {
    stop();
    left = TOTAL;
    render();
  });

  render();
</script>
</body>
</html>
