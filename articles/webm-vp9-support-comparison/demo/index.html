<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; font-size: 13px; }
        #user-agent, #summary { font-family: monospace; font-size: 12px; }
        #table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; margin: 8px 0; }
        th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: middle; }
        th { background: #f4f4f4; }
        td.mono { font-family: monospace; white-space: nowrap; }
        .preview {
            background: repeating-conic-gradient(#c33 0% 25%, #eee 0% 50%) 0 0 / 16px 16px;
            padding: 4px; display: inline-block;
        }
        .preview video { display: block; width: 100px; height: 100px; }
        .verdict {
            display: inline-block; font-family: monospace; font-weight: bold; color: #fff;
            background: #888; padding: 2px 6px; border-radius: 3px; white-space: nowrap;
        }
        #summary { white-space: pre; background: #f8f8f8; padding: 8px; overflow-x: auto; }
    </style>
</head>
<body>
    <div id="user-agent"></div>
    <div id="table-wrap">
    <table>
        <thead>
            <tr>
                <th>File</th>
                <th>Profile</th>
                <th>Bit depth</th>
                <th>Chroma</th>
                <th>Alpha</th>
                <th>canPlayType</th>
                <th>MSE isTypeSupported</th>
                <th>mediaCapabilities</th>
                <th>Playback</th>
                <th>VideoFrame.format</th>
                <th>Alpha at x=25/75/125/175<br>(expected)</th>
                <th>Verdict</th>
                <th>Preview</th>
            </tr>
        </thead>
        <tbody id="results"></tbody>
    </table>
    </div>
    <div id="summary"></div>
    <script type="module" src="index.mjs"></script>
</body>
</html>
