<!DOCTYPE html>
<html>
    <head>
        <title>Page title</title>
    </head>
    <body>
        <h2>
            Stepancar's blog
        </h2>
        <ul>
            {% for page in collections.articles %}
                <li>
                    {% if page.data.creationDate %}<time datetime="{{ page.data.creationDate | articleDate }}">{{ page.data.creationDate | articleDate }}</time> — {% endif %}<a href="{{ page.url }}">{{ page.data.title }}</a>
                </li>
            {% endfor %}
        </ul>
    </body>
</html>
